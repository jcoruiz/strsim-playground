# Response headers for AWS Amplify Hosting.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
  - pattern: '**/*.wasm'
    headers:
      - key: Content-Type
        value: application/wasm
  - pattern: 'assets/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
