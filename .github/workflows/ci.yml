name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache-dependency-path: wasm/versions/*.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Go bridge against every strsim release (native and js/wasm)
        working-directory: wasm
        run: |
          test -z "$(gofmt -l .)"
          for mod in versions/*.mod; do
            echo "::group::$mod"
            go vet -modfile="$mod" ./...
            go test -race -modfile="$mod" ./...
            PATH="$(go env GOROOT)/lib/wasm:$PATH" GOOS=js GOARCH=wasm go test -modfile="$mod" ./...
            echo "::endgroup::"
          done
      - run: npm ci
      - name: Re-implementation against the WASM builds and Commons Codec; generated Go runs on every release
        run: npm test
      - run: npm run build

  commits:
    # Same check as scripts/hooks/commit-msg, for clones without the hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
            printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
            scripts/hooks/commit-msg "$RUNNER_TEMP/title"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            exit 0
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/hooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
